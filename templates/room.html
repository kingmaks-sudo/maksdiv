<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action ou Vérité — Accueil</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<!-- PWA : rend l'app installable ("Ajouter à l'écran d'accueil") -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#0f0f14">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAKSDIV">
</head>
<body>
<div class="home-wrapper">
    <div class="home-card">
        <h1 class="brand">🍾 Action ou Vérité</h1>
        <p class="subtitle">Un jeu social pour adultes, entre amis, à distance ou en présentiel.</p>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <div class="age-gate">
            <label>
                <input type="checkbox" id="age-confirm">
                J'ai 18 ans ou plus et j'accepte que ce jeu contienne du contenu suggéré pour adultes.
            </label>
        </div>

        <div class="home-actions">
            <div class="home-block">
                <h2>Créer un salon</h2>
                <form action="{{ url_for('create_room') }}" method="POST" id="create-form">
                    <label>Nombre de places max (optionnel)</label>
                    <input type="number" name="max_players" min="2" max="50" placeholder="Illimité">
                    <button type="submit" class="btn-primary" id="create-btn" disabled>Créer le salon</button>
                </form>
            </div>

            <div class="divider">ou</div>

            <div class="home-block">
                <h2>Rejoindre un salon</h2>
                <form action="{{ url_for('join_by_code') }}" method="POST" id="join-form">
                    <label>Code du salon</label>
                    <input type="text" name="code" maxlength="6" placeholder="AB3F9K" style="text-transform:uppercase" required>
                    <button type="submit" class="btn-secondary" id="join-btn" disabled>Rejoindre</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
const ageBox = document.getElementById('age-confirm');
const createBtn = document.getElementById('create-btn');
const joinBtn = document.getElementById('join-btn');
ageBox.addEventListener('change', () => {
    createBtn.disabled = !ageBox.checked;
    joinBtn.disabled = !ageBox.checked;
});
</script>
<script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
</body>
</html>
